name: Luchtvaartdata ophalen

on:
  schedule:
    # Draait elke maandag om 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch: # Maakt het ook mogelijk om handmatig op te starten via GitHub UI

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Code ophalen
      uses: actions/checkout@v3

    - name: Python instellen
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Afhankelijkheden installeren
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests beautifulsoup4 odfpy

    - name: Mappen aanmaken
      run: |
        sudo mkdir -p /raw/ilt_luchtvaartregister
        sudo mkdir -p /storage
        sudo chmod -R 777 /raw /storage

    - name: Script uitvoeren
      run: python get_luchtvaartdata.py

    - name: JSON-bestand committen en pushen naar repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add storage/
        git commit -m "Automated update: ILT luchtvaartregister JSON" || exit 0
        git push
